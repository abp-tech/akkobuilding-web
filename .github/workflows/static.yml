name: Publish AKKO website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p _site
          unzip -q akko-site.zip -d _site
          if [ -d assets ]; then
            mkdir -p _site/assets
            rsync -a --exclude='.gitkeep' --exclude='README.md' --exclude='.DS_Store' assets/ _site/assets/
          fi
          test -s _site/index.html
          test -f _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
